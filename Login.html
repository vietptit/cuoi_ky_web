<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Mai Coffee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/Login.css">
</head>

<body>
    <div class="auth-container">
        <!--  Image -->
        <div class="auth-image-side">
    
            <img src="image/section44.png" alt="Coffee Aesthetic">
        </div>

        <!--  Form -->
        <div class="auth-form-side">
            <div class="auth-form-wrapper">
                <h1 class="auth-title">ĐĂNG NHẬP</h1>

                <form action="#">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Mật khẩu</label>
                        <input type="password" class="form-control" required>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox"> Ghi nhớ đăng nhập
                        </label>
                        <a href="ForgotPassword.html" class="forgot-link">Quên mật khẩu?</a>
                    </div>

                    <button type="submit" class="btn-auth" onclick="window.location.href='userinfo-page.html'">Đăng Nhập</button>

                    <div class="auth-footer">
                        Bạn chưa có tài khoản? <a href="Register.html">Đăng ký ngay</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
