<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - Mai Coffee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/Auth.css">
    <link rel="stylesheet" href="css/Password.css">

</head>

<body>
    <div class="auth-container">
        <div class="auth-form-side">
            <div class="auth-form-wrapper">
                <h1 class="auth-title" style="text-align: center;">QUÊN MẬT KHẨU</h1>

                <!-- EMAIL -->
                <div id="step1" class="step active">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Nhập email của bạn">
                    </div>
                    <div class="btn-group">
                        <button type="button" class="btn-auth btn-outline"
                            onclick="window.location.href='Login.html'">Quay lại</button>
                        <button type="button" class="btn-auth" onclick="goToStep(2)">Tiếp tục</button>
                    </div>
                </div>

                <!-- OTP -->
                <div id="step2" class="step">
                    <div class="form-group">
                        <label class="form-label">Mã OTP</label>
                        <input type="text" class="form-control" placeholder="Nhập mã OTP đã gửi về email">
                    </div>
                    <div class="btn-group">
                        <button type="button" class="btn-auth btn-outline" onclick="goToStep(1)">Quay lại</button>
                        <button type="button" class="btn-auth" onclick="goToStep(3)">Tiếp tục</button>
                    </div>
                </div>

                <!--  NEW PASSWORD -->
                <div id="step3" class="step">
                    <div class="form-group">
                        <label class="form-label">Mật khẩu mới</label>
                        <input type="password" class="form-control" placeholder="Nhập mật khẩu mới">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nhập lại mật khẩu</label>
                        <input type="password" class="form-control" placeholder="Xác nhận mật khẩu">
                    </div>
                    <div class="btn-group">
                        <button type="button" class="btn-auth btn-outline" onclick="goToStep(2)">Quay lại</button>
                        <button type="button" class="btn-auth" onclick="finishReset()">Tiếp tục</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function goToStep(stepNumber) {
            // Hide all steps
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            // Show target step
            document.getElementById('step' + stepNumber).classList.add('active');
        }

        function finishReset() {
            alert("Mật khẩu đã được đặt lại thành công!");
            window.location.href = 'Login.html';
        }
    </script>
</body>

</html>
